version: '3.9'

services:
  # MongoDB — shared by all services
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval 'db.adminCommand("ping")' --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phoenix-net

  # Phoenix API Orchestrator (real, not mocked) — port 8000
  phoenix-api:
    build:
      context: ./phoenix-api
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=phoenix
      - PHOENIX_WEBHOOK_SECRET=${PHOENIX_WEBHOOK_SECRET:-local-dev-secret}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_BASE_BRANCH=${GITHUB_BASE_BRANCH:-main}
      - PHOENIX_GIT_AUTHOR_NAME=${PHOENIX_GIT_AUTHOR_NAME:-Phoenix Bot}
      - PHOENIX_GIT_AUTHOR_EMAIL=${PHOENIX_GIT_AUTHOR_EMAIL:-phoenix@example.com}
      - PHOENIX_REPO_PATH=${PHOENIX_REPO_PATH:-/tmp/phoenix-repo}
      - SANDBOX_RUN_DOCKER=${SANDBOX_RUN_DOCKER:-true}
      - SANDBOX_SKIP_DOCKER_IF_UNAVAILABLE=${SANDBOX_SKIP_DOCKER_IF_UNAVAILABLE:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${PHOENIX_REPO_PATH:-.}:/tmp/phoenix-repo
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - phoenix-net
    command: uvicorn phoenix_api.app.main:app --host 0.0.0.0 --port 8000 --reload

  # Phoenix Frontend (Vite) — port 3000
  phoenix-frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - phoenix-api
    networks:
      - phoenix-net
    environment:
      - VITE_API_URL=http://localhost:8000

  # Optional: Phoenix Backend (Flask agent) — port 5000
  # Kept for backward compatibility with the Docker runtime agent
  phoenix-backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=phoenix
      - FLASK_ENV=development
    networks:
      - phoenix-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mongo-data:

networks:
  phoenix-net:
    driver: bridge
